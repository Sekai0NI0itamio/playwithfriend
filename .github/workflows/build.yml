name: Build mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Gradle + Forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-fg23-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-fg23-

      - name: Install Gradle 4.9 (required by ForgeGradle 2.3)
        run: |
          curl -sL -o /tmp/gradle-4.9-bin.zip https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q /tmp/gradle-4.9-bin.zip -d /tmp
          echo "/tmp/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwithfriend-jar
          path: build/libs/*.jar
