name: Build mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Gradle + Forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-fg23-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-fg23-

      - name: Install Gradle 4.9 (required by ForgeGradle 2.3)
        run: |
          curl -sL -o /tmp/gradle-4.9-bin.zip https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q /tmp/gradle-4.9-bin.zip -d /tmp
          echo "/tmp/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwithfriend-jar
          path: build/libs/*.jar

      - name: Stage stable jar name
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          ls build/libs/
          JAR=$(ls build/libs/*.jar | grep -v -i -e sources -e javadoc | head -n 1)
          echo "Releasing $JAR"
          cp "$JAR" playwithfriend-1.12.2.jar

      - name: Publish latest release
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest successful build"
          body: |
            Auto-built from `${{ github.sha }}` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            Install: Minecraft 1.12.2 + Forge 14.23.5.2847, drop `playwithfriend-1.12.2.jar` into `.minecraft/mods/`.
          files: playwithfriend-1.12.2.jar
          draft: false
          prerelease: false
